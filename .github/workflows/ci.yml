name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality, metadata and docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project and compatibility metadata
        run: npm run check:metadata

      - name: Check generated documentation
        run: |
          npm run docs:generate
          git diff --exit-code README.md docs/usage.md docs/types.md docs/compatibility.md

      - name: Build package
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Check npm package content
        run: npm run pack:check

  integration:
    name: Docker integration
    runs-on: ubuntu-latest
    needs:
      - quality
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull downstream images
        run: docker compose -f docker-compose.integration.yml pull

      - name: Download downstream model files
        run: |
          docker compose -f docker-compose.integration.yml up \
            core-models \
            antispoof-models

      - name: Run integration services and tests
        run: |
          docker compose -f docker-compose.integration.yml up --build \
            --exit-code-from age-decision-js \
            age-decision-js

      - name: Cleanup integration stack
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v --remove-orphans
