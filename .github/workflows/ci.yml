name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality, metadata, docs, build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI-equivalent checks
        run: npm run check:all

  integration:
    name: Docker integration
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull downstream images
        run: docker compose -f docker-compose.integration.yml pull

      - name: Download downstream model files
        run: |
          docker compose -f docker-compose.integration.yml up \
            core-models \
            antispoof-models

      - name: Run integration services and tests
        run: |
          docker compose -f docker-compose.integration.yml up --build \
            --exit-code-from age-decision-js \
            age-decision-js

      - name: Cleanup integration stack
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v --remove-orphans

  auto-tag:
    name: Automatic release tag
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create tag from project metadata
        env:
          AGE_DECISION_RELEASE_TOKEN: ${{ secrets.AGE_DECISION_RELEASE_TOKEN }}
        run: node scripts/release/create-tag-from-project.mjs
