name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release metadata
        run: npm run check:release

      - name: Run CI-equivalent checks
        run: npm run check:all

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [verify-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate release notes from changelog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path("project.json").read_text(encoding="utf-8"))["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          start_marker = f"<h2>{version}</h2>"
          start = changelog.find(start_marker)
          if start == -1:
              raise SystemExit(f"Missing changelog section for version {version}")
          end = changelog.find("<hr>", start)
          if end == -1:
              end = len(changelog)
          section = changelog[start:end].strip()
          Path("RELEASE_NOTES.md").write_text(
              f"## {version}\n\n{section}\n",
              encoding="utf-8",
          )
          PY

      - name: Create release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
