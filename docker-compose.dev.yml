services:
  age-decision-js:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: age-decision-js-dev:2.2.1
    container_name: age-decision-js
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    command: tail -f /dev/null

volumes:
  node_modules:
