services:
  age-decision-core:
    image: ghcr.io/credona/age-decision-core:latest

  age-decision-antispoof:
    image: ghcr.io/credona/age-decision-antispoof:latest

  age-decision-api:
    image: ghcr.io/credona/age-decision-api:latest
    depends_on:
      - age-decision-core
      - age-decision-antispoof
    environment:
      AGE_DECISION_CORE_URL: http://age-decision-core:8000
      AGE_DECISION_ANTISPOOF_URL: http://age-decision-antispoof:8001

  age-decision-js:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - age-decision-api
    working_dir: /app
    command: sh -c "npm run test:integration"